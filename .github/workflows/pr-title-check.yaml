name: PR Title Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Check PR title follows Conventional Commits
        id: pr_title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post results as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = [
              '## PR Title Check Failed',
              '',
              `Current title: \`${title}\``,
              '',
              'PR titles must follow [Conventional Commits](https://www.conventionalcommits.org/) format:',
              '',
              '```',
              '<type>[optional scope]: <description>',
              '```',
              '',
              '**Valid types:** `feat`, `fix`, `chore`, `docs`, `ci`, `refactor`, `test`, `perf`, `style`, `revert`',
              '',
              '**Examples:**',
              '- `feat: add velero backup schedule`',
              '- `fix(app): correct health check endpoint`',
              '- `ci: add pr title check workflow`',
              '',
              'Edit the PR title and the check will re-run automatically.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## PR Title Check Failed'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
