name: CODEOWNERS Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/CODEOWNERS'
      - '.github/workflows/codeowners-check.yaml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate CODEOWNERS
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install codeowners-validator
        run: go install github.com/mszostok/codeowners-validator@v0.7.4

      - name: Validate CODEOWNERS
        id: codeowners
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          CHECKS: "syntax,duppatterns,owners"
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/codeowners-validator" \
            2>&1 | tee "$GITHUB_WORKSPACE/codeowners-report.txt"

      - name: Post results as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('codeowners-report.txt')
              ? fs.readFileSync('codeowners-report.txt', 'utf8').trim()
              : 'No report generated.';
            const body = `## CODEOWNERS Validation Results\n\`\`\`\n${report}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## CODEOWNERS Validation Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
