apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-ebs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: storage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          accountId: '{{index .metadata.annotations "aws-account-id"}}'
          clusterName: '{{index .metadata.annotations "cluster-name"}}'
  template:
    metadata:
      name: 'aws-ebs-csi-driver-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: storage
    spec:
      project: platform
      source:
        repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver/
        chart: aws-ebs-csi-driver
        targetRevision: 2.32.0
        helm:
          releaseName: aws-ebs-csi-driver
          values: |
            controller:
              serviceAccount:
                create: true
                name: ebs-csi-controller-sa
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::{{ .values.accountId }}:role/{{ .values.clusterName }}-ebs-csi-controller-irsa
              nodeSelector:
                app: core
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

            node:
              tolerateAllTaints: true

            storageClasses:
              - name: gp3
                annotations:
                  storageclass.kubernetes.io/is-default-class: "true"
                parameters:
                  type: gp3
                  encrypted: "true"
                reclaimPolicy: Retain
                volumeBindingMode: WaitForFirstConsumer
                allowVolumeExpansion: true
      destination:
        server: '{{.server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
