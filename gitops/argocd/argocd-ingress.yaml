apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: networking
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          domainName: '{{index .metadata.annotations "domain-name"}}'
  template:
    metadata:
      name: 'argocd-ingress-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: networking
    spec:
      project: default
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: argocd-ingress
          values: |
            resources:
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: argocd
                  namespace: argocd
                  annotations:
                    kubernetes.io/ingress.class: alb
                    alb.ingress.kubernetes.io/scheme: internet-facing
                    alb.ingress.kubernetes.io/target-type: ip
                    alb.ingress.kubernetes.io/backend-protocol: HTTP
                    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
                    alb.ingress.kubernetes.io/ssl-redirect: "443"
                    alb.ingress.kubernetes.io/healthcheck-path: /healthz
                spec:
                  ingressClassName: alb
                  tls:
                    - hosts:
                        - "argocd.platform.{{ .values.domainName }}"
                  rules:
                    - host: "argocd.platform.{{ .values.domainName }}"
                      http:
                        paths:
                          - path: /
                            pathType: Prefix
                            backend:
                              service:
                                name: argocd-server
                                port:
                                  number: 80
      destination:
        server: '{{.server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true