apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-admin-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: secrets
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'argocd-admin-secret-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: secrets
    spec:
      project: platform
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: argocd-admin-secret
          values: |
            resources:
              - apiVersion: external-secrets.io/v1beta1
                kind: ExternalSecret
                metadata:
                  name: argocd-admin-password
                  namespace: argocd
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: aws-secrets-manager
                    kind: ClusterSecretStore
                  target:
                    name: argocd-secret
                    creationPolicy: Merge
                    deletionPolicy: Retain
                  data:
                    - secretKey: admin.password
                      remoteRef:
                        key: argocd-admin
                        property: adminPasswordHash
                        conversionStrategy: Default
                        decodingStrategy: None
                        metadataPolicy: None

                    - secretKey: admin.passwordMtime
                      remoteRef:
                        key: argocd-admin
                        property: adminPasswordMtime
                        conversionStrategy: Default
                        decodingStrategy: None
                        metadataPolicy: None
      destination:
        server: '{{.server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true