apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: monitoring
spec:
  description: Observability stack - metrics, logs, traces, and alerting (Prometheus, Grafana, Thanos, Loki, Tempo, Fluent Bit)

  sourceRepos:
    - https://prometheus-community.github.io/helm-charts
    - registry-1.docker.io/bitnamicharts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://fluent.github.io/helm-charts
    # GitOps repo (dashboards, datasources, alert rules, secrets)
    - https://github.com/Beem0807/eks-gitops-platform.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: logging
    - server: https://kubernetes.default.svc
      namespace: tracing
    - server: https://kubernetes.default.svc
      namespace: kube-system

  # kube-system destination is required by kube-prometheus-stack: the chart creates
  # headless Services there (e.g. prometheus-kube-prometheus-coredns, -kubelet) so
  # Prometheus can discover and scrape kube-system components via ServiceMonitors.

  # Cluster-scoped resources required by the observability stack:
  # - Prometheus Operator: CRDs, ClusterRole/Binding, admission webhooks
  # - Prometheus Adapter: APIService to register custom.metrics.k8s.io with the aggregation layer
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService

  orphanedResources:
    warn: true
