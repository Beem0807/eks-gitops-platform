apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: argocd
spec:
  description: Policy enforcement — Kyverno admission controller and ClusterPolicy rules

  sourceRepos:
    # Kyverno Helm chart
    - https://kyverno.github.io/kyverno
    # Policy Reporter UI
    - https://kyverno.github.io/policy-reporter
    # GitOps repo (kyverno-policies via charts/raw)
    - https://github.com/Beem0807/eks-gitops-platform.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: security

  # Kyverno installs cluster-scoped infrastructure: CRDs, RBAC, admission webhooks,
  # and ClusterPolicy resources that gate every admission request cluster-wide.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    # Kyverno policy resources (cluster-scoped)
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: ClusterCleanupPolicy
    # Policy reports generated by the reports controller
    - group: wgpolicyk8s.io
      kind: ClusterPolicyReport

  orphanedResources:
    warn: true
