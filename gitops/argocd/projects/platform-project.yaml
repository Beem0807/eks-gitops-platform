apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: argocd
spec:
  description: ArgoCD self-management, cluster infrastructure (networking, autoscaling, secrets)

  sourceRepos:
    # ArgoCD
    - https://argoproj.github.io/argo-helm
    # Networking
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    # Autoscaling
    - https://kubernetes.github.io/autoscaler
    - public.ecr.aws/karpenter
    - https://kubernetes-sigs.github.io/metrics-server/
    # Storage
    - https://kubernetes-sigs.github.io/aws-ebs-csi-driver/
    - https://vmware-tanzu.github.io/helm-charts
    # Secrets
    - https://charts.external-secrets.io
    - https://stakater.github.io/stakater-charts
    # CI - Actions Runner Controller (OCI registry)
    - ghcr.io/actions/actions-runner-controller-charts
    # Event-driven autoscaling
    - https://kedacore.github.io/charts
    # GitOps repo (karpenter nodepools, cluster-secret-store, argocd ingress/secret)
    - https://github.com/Beem0807/eks-gitops-platform.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: karpenter
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: reloader
    - server: https://kubernetes.default.svc
      namespace: velero
    # Karpenter creates a RoleBinding here to delete node Lease objects on node termination
    - server: https://kubernetes.default.svc
      namespace: kube-node-lease
    # Actions Runner Controller. arc-systems holds the controller; arc-runners
    # holds only the GitHub App ExternalSecret this project manages - the
    # runner scale sets themselves belong to the consuming project's own
    # AppProject, not to platform.
    - server: https://kubernetes.default.svc
      namespace: arc-systems
    - server: https://kubernetes.default.svc
      namespace: arc-runners
    # KEDA controller. ScaledObjects and ScaledJobs are namespaced with the
    # workload they scale, so they belong to that workload's AppProject.
    - server: https://kubernetes.default.svc
      namespace: keda

  # Infrastructure tools install CRDs, ClusterRoles, and webhooks - allow all cluster-scoped resources
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
