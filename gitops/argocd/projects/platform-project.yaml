apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: argocd
spec:
  description: ArgoCD self-management, cluster infrastructure (networking, autoscaling, secrets)

  sourceRepos:
    # ArgoCD
    - https://argoproj.github.io/argo-helm
    # Networking
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    # Autoscaling
    - https://kubernetes.github.io/autoscaler
    - public.ecr.aws/karpenter
    - https://kubernetes-sigs.github.io/metrics-server/
    # Secrets
    - https://charts.external-secrets.io
    - https://stakater.github.io/stakater-charts
    # GitOps repo (karpenter nodepools, cluster-secret-store, argocd ingress/secret)
    - https://github.com/Beem0807/eks-gitops-platform.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: karpenter
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: reloader

  # Infrastructure tools install CRDs, ClusterRoles, and webhooks — allow all cluster-scoped resources
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
