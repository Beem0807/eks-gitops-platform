apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: namespaces
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: namespaces
spec:
  description: Cluster namespace lifecycle management - creates namespaces and enforces resource quotas

  sourceRepos:
    - https://github.com/Beem0807/eks-gitops-platform.git

  # Wildcard namespace destination is safe here - this project's only cluster-scoped
  # permission is Namespace, and ResourceQuotas are bounded by what the chart defines.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota

  orphanedResources:
    warn: true
