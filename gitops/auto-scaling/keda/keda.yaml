apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keda
  namespace: argocd
  annotations:
    # Wave 11, alongside Crossplane. Nothing in waves -1..10 depends on KEDA,
    # and the workloads that do scale through it are ApplicationSets in
    # consuming repositories which sync later still.
    argocd.argoproj.io/sync-wave: "11"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: keda
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'keda-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: keda
    spec:
      project: platform
      source:
        repoURL: https://kedacore.github.io/charts
        chart: keda
        targetRevision: 2.21.0
        helm:
          releaseName: keda
          values: |
            # The operator, metrics adapter and admission webhooks all run on
            # core nodes with the rest of the platform control plane.
            nodeSelector:
              app: core

            tolerations:
              - key: app
                operator: Equal
                value: core
                effect: NoSchedule

            # No IRSA annotation on the ServiceAccount. Credentials come from
            # EKS Pod Identity, which the agent injects at run time via the
            # container credential provider - there is nothing to annotate.
            # The association is created in terraform/keda.tf against the
            # ServiceAccount name below, so that name must not be overridden.
            serviceAccount:
              create: true
              name: keda-operator

            # Scraped by the platform's existing Prometheus. The `release`
            # label is what the kube-prometheus-stack serviceMonitorSelector
            # matches on; without it the ServiceMonitor is created and silently
            # never scraped.
            prometheus:
              metricServer:
                enabled: true
                serviceMonitor:
                  enabled: true
                  additionalLabels:
                    release: prometheus
              operator:
                enabled: true
                serviceMonitor:
                  enabled: true
                  additionalLabels:
                    release: prometheus

            resources:
              operator:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              metricServer:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              webhooks:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
      destination:
        server: '{{.server}}'
        namespace: keda
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # KEDA's CRDs are large enough to exceed the annotation size limit
          # that client-side apply uses to store last-applied-configuration.
          - ServerSideApply=true
