apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nodepools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: auto-scaling
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          clusterName: '{{index .metadata.annotations "cluster-name"}}'
          instanceProfileName: '{{index .metadata.annotations "karpenter-instance-profile-name"}}'
          amiAlias: 'al2023@v20260415'
  template:
    metadata:
      name: 'karpenter-nodepools-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: auto-scaling
    spec:
      project: platform
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: karpenter-nodepools
          values: |
            resources:
              - apiVersion: karpenter.k8s.aws/v1
                kind: EC2NodeClass
                metadata:
                  name: workload
                spec:
                  amiFamily: AL2023
                  amiSelectorTerms:
                    - alias: "{{ .values.amiAlias }}"
                  instanceProfile: "{{ .values.instanceProfileName }}"
                  subnetSelectorTerms:
                    - tags:
                        karpenter.sh/discovery: "{{ .values.clusterName }}"
                        subnet-type: private
                  securityGroupSelectorTerms:
                    - tags:
                        karpenter.sh/discovery: "{{ .values.clusterName }}"
                  tags:
                    karpenter.sh/discovery: "{{ .values.clusterName }}"
                    app: workload
                    managed-by: karpenter

              - apiVersion: karpenter.sh/v1
                kind: NodePool
                metadata:
                  name: workload
                spec:
                  template:
                    metadata:
                      labels:
                        app: workload
                    spec:
                      nodeClassRef:
                        group: karpenter.k8s.aws
                        kind: EC2NodeClass
                        name: workload

                      taints:
                        - key: app
                          value: workload
                          effect: NoSchedule

                      expireAfter: 720h

                      requirements:
                        - key: karpenter.sh/capacity-type
                          operator: In
                          values:
                            - on-demand

                        - key: node.kubernetes.io/instance-type
                          operator: In
                          values:
                            - t3a.medium
                            - c6a.large

                  disruption:
                    consolidationPolicy: WhenEmptyOrUnderutilized
                    consolidateAfter: 5m
                    budgets:
                      - nodes: 20%

                  limits:
                    cpu: "100"
                    memory: 200Gi
      destination:
        server: '{{.server}}'
        namespace: karpenter
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true