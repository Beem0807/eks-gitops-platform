apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: auto-scaling
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          accountId: '{{index .metadata.annotations "aws-account-id"}}'
          clusterName: '{{index .metadata.annotations "cluster-name"}}'
          region: '{{index .metadata.labels "region"}}'
  template:
    metadata:
      name: 'karpenter-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: auto-scaling
    spec:
      project: platform
      source:
        repoURL: public.ecr.aws/karpenter
        chart: karpenter
        targetRevision: 1.0.8
        helm:
          releaseName: karpenter
          values: |
            serviceAccount:
              create: true
              name: karpenter

            settings:
              clusterName: "{{ .values.clusterName }}"
              interruptionQueue: "{{ .values.clusterName }}-karpenter-interruption"

            controller:
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: 1
                  memory: 1Gi

            nodeSelector:
              app: core

            tolerations:
              - key: app
                operator: Equal
                value: core
                effect: NoSchedule
      destination:
        server: '{{.server}}'
        namespace: karpenter
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
