apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: secrets
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          region: '{{index .metadata.labels "region"}}'
  template:
    metadata:
      name: 'cluster-secret-store-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: secrets
    spec:
      project: default
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: cluster-secret-store
          values: |
            resources:
              - apiVersion: external-secrets.io/v1beta1
                kind: ClusterSecretStore
                metadata:
                  name: aws-secrets-manager
                spec:
                  provider:
                    aws:
                      service: SecretsManager
                      region: "{{ .values.region }}"
                      auth:
                        jwt:
                          serviceAccountRef:
                            name: external-secrets
                            namespace: external-secrets
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true