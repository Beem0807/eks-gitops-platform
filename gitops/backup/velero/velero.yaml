apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: backup
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          accountId: '{{index .metadata.annotations "aws-account-id"}}'
          region: '{{index .metadata.labels "region"}}'
          clusterName: '{{index .metadata.annotations "cluster-name"}}'
          veleroBucketName: '{{index .metadata.annotations "velero-bucket-name"}}'
  template:
    metadata:
      name: 'velero-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: backup
    spec:
      project: platform
      source:
        repoURL: https://vmware-tanzu.github.io/helm-charts
        chart: velero
        targetRevision: 8.1.0
        helm:
          releaseName: velero
          values: |
            credentials:
              useSecret: false

            serviceAccount:
              server:
                create: true
                name: velero
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::{{ .values.accountId }}:role/{{ .values.clusterName }}-velero-irsa

            configuration:
              backupStorageLocation:
                - name: default
                  provider: aws
                  bucket: {{ .values.veleroBucketName }}
                  default: true
                  config:
                    region: {{ .values.region }}
              volumeSnapshotLocation:
                - name: default
                  provider: aws
                  config:
                    region: {{ .values.region }}

            initContainers:
              - name: velero-plugin-for-aws
                image: velero/velero-plugin-for-aws:v1.10.0
                volumeMounts:
                  - mountPath: /target
                    name: plugins

            nodeSelector:
              app: core

            tolerations:
              - key: app
                operator: Equal
                value: core
                effect: NoSchedule

            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
      destination:
        server: '{{.server}}'
        namespace: velero
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
