apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: velero-schedule
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: backup
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'velero-schedule-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: backup
    spec:
      project: platform
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: velero-schedule
          values: |
            resources:
              - apiVersion: velero.io/v1
                kind: Schedule
                metadata:
                  name: daily-backup
                  namespace: velero
                spec:
                  schedule: "0 2 * * *"
                  useOwnerReferencesInBackup: false
                  template:
                    ttl: 720h
                    storageLocation: default
                    volumeSnapshotLocations:
                      - default
                    includedNamespaces:
                      - "*"
                    includeClusterResources: true
      destination:
        server: '{{.server}}'
        namespace: velero
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
