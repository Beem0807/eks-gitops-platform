apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-collector-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: tracing
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'otel-collector-agent-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: tracing
    spec:
      project: observability
      source:
        repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
        chart: opentelemetry-collector
        targetRevision: 0.108.0
        helm:
          releaseName: otel-agent
          values: |
            fullnameOverride: otel-agent

            image:
              repository: otel/opentelemetry-collector-contrib

            mode: daemonset

            config:
              receivers:
                otlp:
                  protocols:
                    http:
                      endpoint: 0.0.0.0:4318
              processors:
                memory_limiter:
                  check_interval: 5s
                  limit_mib: 128
                batch:
                  timeout: 200ms
                  send_batch_size: 128
              exporters:
                otlp:
                  endpoint: otel-gateway.tracing.svc.cluster.local:4317
                  tls:
                    insecure: true
              service:
                pipelines:
                  traces:
                    receivers: [otlp]
                    processors: [memory_limiter, batch]
                    exporters: [otlp]

            ports:
              otlp-http:
                enabled: true
                containerPort: 4318
                servicePort: 4318
                hostPort: 4318
                protocol: TCP

            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

            # Run on every node - core nodes and Karpenter workload nodes
            tolerations:
              - operator: Exists
                effect: NoSchedule

            serviceMonitor:
              enabled: true
      destination:
        server: '{{.server}}'
        namespace: tracing
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
