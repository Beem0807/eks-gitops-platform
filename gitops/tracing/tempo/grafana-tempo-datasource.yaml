apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-tempo-datasource
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: tracing
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'grafana-tempo-datasource-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: tracing
    spec:
      project: observability
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: grafana-tempo-datasource
          values: |
            resources:
              - apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: grafana-tempo-datasource
                  namespace: monitoring
                  labels:
                    grafana_datasource: "1"
                data:
                  tempo-datasource.yaml: |
                    apiVersion: 1
                    datasources:
                      - name: Tempo
                        type: tempo
                        uid: tempo
                        access: proxy
                        url: http://tempo.tracing.svc.cluster.local:3100
                        isDefault: false
                        editable: true
                        jsonData:
                          nodeGraph:
                            enabled: true
                          tracesToLogsV2:
                            datasourceUid: loki
                            filterByTraceID: true
                            filterBySpanID: false
                            customQuery: false
                          lokiSearch:
                            datasourceUid: loki
                          serviceMap:
                            datasourceUid: thanos
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
