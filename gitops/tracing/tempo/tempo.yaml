apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: tracing
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          accountId: '{{index .metadata.annotations "aws-account-id"}}'
          region: '{{index .metadata.labels "region"}}'
          clusterName: '{{index .metadata.annotations "cluster-name"}}'
          tempoBucketName: '{{index .metadata.annotations "tempo-bucket-name"}}'
  template:
    metadata:
      name: 'tempo-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: tracing
    spec:
      project: observability
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: tempo
        targetRevision: 1.10.3
        helm:
          releaseName: tempo
          values: |
            serviceAccount:
              create: true
              annotations:
                eks.amazonaws.com/role-arn: arn:aws:iam::{{ .values.accountId }}:role/{{ .values.clusterName }}-tempo-irsa

            tempo:
              storage:
                trace:
                  backend: s3
                  s3:
                    bucket: {{ .values.tempoBucketName }}
                    region: {{ .values.region }}
                    endpoint: s3.{{ .values.region }}.amazonaws.com
                    insecure: false

              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

              retention: 720h

            tolerations:
              - key: "app"
                operator: "Equal"
                value: "core"
                effect: "NoSchedule"

            serviceMonitor:
              enabled: true
      destination:
        server: '{{.server}}'
        namespace: tracing
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
