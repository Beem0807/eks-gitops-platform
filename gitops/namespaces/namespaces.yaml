apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: namespaces
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: cluster-namespaces-{{.nameNormalized}}
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: namespaces
    spec:
      project: namespaces
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/namespaces
        helm:
          releaseName: cluster-namespaces
          values: |
            global:
              labels:
                app.kubernetes.io/part-of: eks-gitops-platform
                app.kubernetes.io/managed-by: argocd
              annotations: {}
              resourceQuota: {}

            # Every namespace the platform needs - except argocd.
            #
            # The argocd namespace is the bootstrap boundary: it must exist before
            # ArgoCD itself starts, so it is created by `helm install --create-namespace`
            # in bootstrap.sh. This app runs inside ArgoCD (wave -1), so it cannot
            # create the namespace that ArgoCD depends on - that would be circular.
            #
            # kube-system and kube-node-lease are Kubernetes built-ins; never manage them here.
            namespaces:
              - name: karpenter
              - name: external-secrets
              - name: external-dns
              - name: reloader
              - name: velero
              - name: monitoring
              - name: logging
              - name: simple-time-service
              - name: security
              - name: tracing

              # Crossplane core, the AWS providers, and their ProviderConfig.
              - name: crossplane-system

              # Actions Runner Controller. Split in two because the ownership
              # boundary is different: the platform owns the controller in
              # arc-systems, while consuming projects own the runner scale sets
              # in arc-runners. Keeping runners out of the controller namespace
              # means a project can be granted RBAC on its runners without
              # being granted anything over the controller.
              - name: arc-systems
              - name: arc-runners

              # KEDA. Only the controller lives here - ScaledObjects and
              # ScaledJobs are namespaced alongside the workload they scale,
              # which for MLOps means the mlops-system namespace in the MLOps
              # repository.
              - name: keda
      destination:
        server: '{{.server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
