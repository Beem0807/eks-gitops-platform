apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: policy-reporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: security
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          domainName: '{{index .metadata.annotations "domain-name"}}'
  template:
    metadata:
      name: 'policy-reporter-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: security
    spec:
      project: security
      source:
        repoURL: https://kyverno.github.io/policy-reporter
        chart: policy-reporter
        targetRevision: 2.24.1
        helm:
          releaseName: policy-reporter
          values: |
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

            nodeSelector:
              app: core

            tolerations:
              - key: app
                operator: Equal
                value: core
                effect: NoSchedule

            # Kyverno plugin enriches reports with policy metadata
            kyvernoPlugin:
              enabled: true
              nodeSelector:
                app: core
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

            ui:
              enabled: true
              plugins:
                kyverno: true

              basicAuth:
                enabled: true
                secretRef: policy-reporter-basic-auth

              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

              nodeSelector:
                app: core

              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

              ingress:
                enabled: true
                className: alb
                annotations:
                  alb.ingress.kubernetes.io/scheme: internet-facing
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/backend-protocol: HTTP
                  alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
                  alb.ingress.kubernetes.io/ssl-redirect: "443"
                tls:
                  - hosts:
                      - "policy-reporter.platform.{{ .values.domainName }}"
                hosts:
                  - host: "policy-reporter.platform.{{ .values.domainName }}"
                    paths:
                      - path: /
                        pathType: Prefix
      destination:
        server: '{{.server}}'
        namespace: security
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
