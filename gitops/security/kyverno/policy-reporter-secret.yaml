apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: policy-reporter-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: secrets
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'policy-reporter-secret-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: secrets
    spec:
      project: security
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: feature/argocd-hardening
        path: charts/raw
        helm:
          releaseName: policy-reporter-secret
          values: |
            resources:
              - apiVersion: external-secrets.io/v1beta1
                kind: ExternalSecret
                metadata:
                  name: policy-reporter-basic-auth
                  namespace: security
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: aws-secrets-manager
                    kind: ClusterSecretStore
                  target:
                    name: policy-reporter-basic-auth
                    creationPolicy: Owner
                  data:
                    - secretKey: username
                      remoteRef:
                        key: policy-reporter/basic-auth
                        property: username
                        conversionStrategy: Default
                        decodingStrategy: None
                        metadataPolicy: None

                    - secretKey: password
                      remoteRef:
                        key: policy-reporter/basic-auth
                        property: password
                        conversionStrategy: Default
                        decodingStrategy: None
                        metadataPolicy: None
      destination:
        server: '{{.server}}'
        namespace: security
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
