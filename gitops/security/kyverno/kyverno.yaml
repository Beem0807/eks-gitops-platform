apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: security
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'kyverno-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: security
    spec:
      project: security
      source:
        repoURL: https://kyverno.github.io/kyverno
        chart: kyverno
        targetRevision: 3.2.7
        helm:
          releaseName: kyverno
          values: |
            # nodeSelector falls back to global.nodeSelector for all controllers,
            # all cleanupJobs, and the policyReportsCleanup hook job.
            # tolerations have no global fallback — must be set per component.
            global:
              nodeSelector:
                app: core

            admissionController:
              replicas: 1
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

            backgroundController:
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

            cleanupController:
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

            reportsController:
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule

            cleanupJobs:
              admissionReports:
                image:
                  registry: registry.bitnami.com
                tolerations:
                  - key: app
                    operator: Equal
                    value: core
                    effect: NoSchedule
              clusterAdmissionReports:
                image:
                  registry: registry.bitnami.com
                tolerations:
                  - key: app
                    operator: Equal
                    value: core
                    effect: NoSchedule
              updateRequests:
                image:
                  registry: registry.bitnami.com
                tolerations:
                  - key: app
                    operator: Equal
                    value: core
                    effect: NoSchedule
              ephemeralReports:
                image:
                  registry: registry.bitnami.com
                tolerations:
                  - key: app
                    operator: Equal
                    value: core
                    effect: NoSchedule
              clusterEphemeralReports:
                image:
                  registry: registry.bitnami.com
                tolerations:
                  - key: app
                    operator: Equal
                    value: core
                    effect: NoSchedule

            policyReportsCleanup:
              image:
                registry: registry.bitnami.com
              tolerations:
                - key: app
                  operator: Equal
                  value: core
                  effect: NoSchedule
      destination:
        server: '{{.server}}'
        namespace: security
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
