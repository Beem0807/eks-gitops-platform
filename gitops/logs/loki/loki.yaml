apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: logging
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          accountId: '{{index .metadata.annotations "aws-account-id"}}'
          region: '{{index .metadata.labels "region"}}'
          clusterName: '{{index .metadata.annotations "cluster-name"}}'
          lokiBucketName: '{{index .metadata.annotations "loki-bucket-name"}}'
  template:
    metadata:
      name: 'loki-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: logging
    spec:
      project: observability
      source:
        repoURL: https://grafana-community.github.io/helm-charts
        chart: loki
        targetRevision: 6.56.1
        helm:
          releaseName: loki
          values: |
            deploymentMode: SingleBinary

            loki:
              auth_enabled: false
              commonConfig:
                replication_factor: 1
              schemaConfig:
                configs:
                  - from: "2024-01-01"
                    store: tsdb
                    object_store: s3
                    schema: v13
                    index:
                      prefix: loki_index_
                      period: 24h
              storage:
                type: s3
                s3:
                  region: {{ .values.region }}
                  bucketnames: {{ .values.lokiBucketName }}
                  s3ForcePathStyle: false
              rulerConfig: {}
              containerSecurityContext:
                readOnlyRootFilesystem: false

            serviceAccount:
              create: true
              annotations:
                eks.amazonaws.com/role-arn: arn:aws:iam::{{ .values.accountId }}:role/{{ .values.clusterName }}-loki-irsa

            singleBinary:
              tolerations:
                - key: "app"
                  operator: "Equal"
                  value: "core"
                  effect: "NoSchedule"
              replicas: 1
              persistence:
                enabled: false
            
            ruler:
              enabled: false

            backend:
              replicas: 0

            read:
              replicas: 0

            write:
              replicas: 0

            chunksCache:
              enabled: false

            resultsCache:
              enabled: false

            gateway:
              enabled: true
              tolerations:
                - key: "app"
                  operator: "Equal"
                  value: "core"
                  effect: "NoSchedule"

            lokiCanary:
              enabled: false

            test:
              enabled: false

            monitoring:
              serviceMonitor:
                enabled: true
      destination:
        server: '{{.server}}'
        namespace: logging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true