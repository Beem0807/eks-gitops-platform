apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos-objstore-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: monitoring
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          region: '{{index .metadata.labels "region"}}'
          thanosBucketName: '{{index .metadata.annotations "thanos-bucket-name"}}'
  template:
    metadata:
      name: 'thanos-objstore-secret-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: monitoring
    spec:
      project: default
      source:
        repoURL: https://github.com/Beem0807/eks-gitops-platform.git
        targetRevision: main
        path: charts/raw
        helm:
          releaseName: thanos-objstore-secret
          values: |
            resources:
              - apiVersion: v1
                kind: Secret
                metadata:
                  name: thanos-objstore-config
                  namespace: monitoring
                type: Opaque
                stringData:
                  objstore.yml: |
                    type: S3
                    config:
                      bucket: "{{ .values.thanosBucketName }}"
                      endpoint: "s3.{{ .values.region }}.amazonaws.com"
                      region: "{{ .values.region }}"
                      aws_sdk_auth: true
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true