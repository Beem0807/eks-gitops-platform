apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: monitoring
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
        values:
          domainName: '{{index .metadata.annotations "domain-name"}}'
  template:
    metadata:
      name: 'prometheus-{{.nameNormalized}}'
      labels:
        app.kubernetes.io/part-of: eks-gitops-platform
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: monitoring
    spec:
      project: default
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 82.18.0
        helm:
          releaseName: prometheus
          values: |
            grafana:
              enabled: true
              admin:
                existingSecret: grafana-admin
                userKey: admin-user
                passwordKey: admin-password
              tolerations:
                - key: "app"
                  operator: "Equal"
                  value: "core"
                  effect: "NoSchedule"
              ingress:
                enabled: true
                ingressClassName: alb
                annotations:
                  alb.ingress.kubernetes.io/scheme: internet-facing
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/backend-protocol: HTTP
                  alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
                  alb.ingress.kubernetes.io/ssl-redirect: "443"
                  alb.ingress.kubernetes.io/healthcheck-path: /api/health
                  alb.ingress.kubernetes.io/group.name: platform-observability
                hosts:
                  - grafana.platform.{{ .values.domainName }}
                path: /
                pathType: Prefix
                tls:
                  - hosts:
                      - grafana.platform.{{ .values.domainName }}

            alertmanager:
              enabled: true
              ingress:
                enabled: true
                ingressClassName: alb
                annotations:
                  alb.ingress.kubernetes.io/scheme: internet-facing
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/backend-protocol: HTTP
                  alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
                  alb.ingress.kubernetes.io/ssl-redirect: "443"
                  alb.ingress.kubernetes.io/healthcheck-path: /-/ready
                  alb.ingress.kubernetes.io/group.name: platform-observability
                hosts:
                  - alertmanager.platform.{{ .values.domainName }}
                paths:
                  - /
                pathType: Prefix
                tls:
                  - hosts:
                      - alertmanager.platform.{{ .values.domainName }}
              alertmanagerSpec:
                alertmanagerConfigSelector: {}
                alertmanagerConfigNamespaceSelector: {}
                alertmanagerConfigMatcherStrategy:
                  type: None
                tolerations:
                  - key: "app"
                    operator: "Equal"
                    value: "core"
                    effect: "NoSchedule"

            prometheus:
              ingress:
                enabled: true
                ingressClassName: alb
                annotations:
                  alb.ingress.kubernetes.io/scheme: internet-facing
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/backend-protocol: HTTP
                  alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
                  alb.ingress.kubernetes.io/ssl-redirect: "443"
                  alb.ingress.kubernetes.io/healthcheck-path: /-/ready
                  alb.ingress.kubernetes.io/group.name: platform-observability
                hosts:
                  - prometheus.platform.{{ .values.domainName }}
                paths:
                  - /
                pathType: Prefix
                tls:
                  - hosts:
                      - prometheus.platform.{{ .values.domainName }}
              prometheusSpec:
                retention: 7d
                serviceMonitorSelectorNilUsesHelmValues: false
                tolerations:
                  - key: "app"
                    operator: "Equal"
                    value: "core"
                    effect: "NoSchedule"

            prometheusOperator:
              tolerations:
                - key: "app"
                  operator: "Equal"
                  value: "core"
                  effect: "NoSchedule"
              tls:
                enabled: false
              admissionWebhooks:
                enabled: false
                patch:
                  enabled: false

            kube-state-metrics:
              tolerations:
                - key: "app"
                  operator: "Equal"
                  value: "core"
                  effect: "NoSchedule"

            prometheus-node-exporter:
              tolerations:
                - operator: "Exists"
                  effect: "NoSchedule"

            # kube-scheduler and kube-controller-manager are managed by AWS on EKS
            # and are not exposed for Prometheus scraping - disable these rules to avoid noise
            kubeScheduler:
              enabled: false
            kubeControllerManager:
              enabled: false

            defaultRules:
              rules:
                kubeSchedulerAlerting: false
                kubeControllerManager: false
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true